<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Fireworks 💖</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        font-family: Arial, sans-serif;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
    }

    .text {
        position: absolute;
        bottom: 100px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .heart {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 100px;
        color: hotpink;
        animation: pop 2s forwards, beat 1s infinite;
        text-shadow: 0 0 20px pink, 0 0 40px red;
    }

    @keyframes pop {
        to { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes beat {
        0%,100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.2); }
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="heart">💖</div>
<div class="text" id="text"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

// ================= FIREWORK =================
function createFirework() {
    let x = Math.random() * canvas.width;
    let y = Math.random() * canvas.height / 2;

    for (let i = 0; i < 80; i++) {
        particles.push({
            x: x,
            y: y,
            angle: Math.random() * 2 * Math.PI,
            speed: Math.random() * 5 + 2,
            radius: 2
        });
    }
}

function updateParticles() {
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";

    particles.forEach((p, index) => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.speed *= 0.97;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        if (p.speed < 0.5) {
            particles.splice(index, 1);
        }
    });
}

// loop
function animate() {
    requestAnimationFrame(animate);
    updateParticles();
}

animate();

// spawn fireworks
setInterval(createFirework, 800);

// ================= TEXT =================
const messages = [
    "Heyyy Acelllll",
    "I just wanna say,,,",
    "Aku bangga banget sama kamu!!!💖",
    "Tetap terus semangat ya disana, and don't worry ill be here. And always here💖"
];

let index = 0;
let charIndex = 0;
const textEl = document.getElementById("text");

function typeText() {
    if (index < messages.length) {
        if (charIndex < messages[index].length) {
            textEl.innerHTML += messages[index][charIndex];
            charIndex++;
            setTimeout(typeText, 70);
        } else {
            setTimeout(() => {
                textEl.innerHTML = "";
                charIndex = 0;
                index++;
                typeText();
            }, 1500);
        }
    } else {
        textEl.innerHTML = "💖 SEMANGAT PAK MARCIELO!!! 💖";
    }
}

setTimeout(typeText, 2000);

</script>

<audio autoplay loop>
  <source src="SnapTik.Net_7596991066449202440.mp3" type="audio/mpeg">
</audio>

</body>
</html>
